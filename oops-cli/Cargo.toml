[package]
name = "oops-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "analyzer_demo"
path = "src/bin/analyzer_demo.rs"

[dependencies]
oops-core = { path = "../oops-core" }
oops-ingest = { path = "../oops-ingest" }
oops-analyzers = { path = "../oops-analyzers" }
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
geojson = "0.24"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }